{% extends 'base.html' %}

{% block title %}{{ page_title }} | Northstar{% endblock %}

{% block content %}
    <section class="panel form-panel">
        <p class="muted"><a href="{% url 'home' %}">Shop</a> / Products</p>
        <h1 class="page-heading">{{ page_title }}</h1>
        <p class="intro">Add clear product details so customers know exactly what they are buying.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">{{ submit_label }}</button>
                <a class="button button-secondary" href="{% if product %}{% url 'product_detail' product.id %}{% else %}{% url 'home' %}{% endif %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
